services:
  node:
    build:
      dockerfile: Dockerfile.node
    container_name: node_compose
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - postgresql
      - mongodb
    networks:
      - gameStoreNetwork
  postgresql:
    build:
      dockerfile: Dockerfile.postgresql
    environment:
      POSTGRES_USER: ${PGUSER}
      POSTGRES_PASSWORD: ${PGPASSWORD}
      POSTGRES_DB: gameStore
    container_name: postgresql_compose
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gameStoreNetwork
  mongodb:
    build:
      dockerfile: Dockerfile.mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: gameStore_nosql
    container_name: mongodb_compose
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - gameStoreNetwork

volumes:
  postgres_data:
  mongodb_data:

networks:
  gameStoreNetwork:
    driver: bridge